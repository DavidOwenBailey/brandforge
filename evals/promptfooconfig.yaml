# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Baseline vs pipeline (BF-34) and the deterministic assertions (BF-35).
# The judge rubric comes later.
#
# From the repo root, with the project environment available:
#   npx promptfoo@latest eval --config evals/promptfooconfig.yaml
# Promptfoo has to import brandforge. If it picks another interpreter, set
# PROMPTFOO_PYTHON to the path printed by:
#   uv run python -c "import sys; print(sys.executable)"
description: BrandForge baseline vs pipeline

prompts:
  - "{{case_id}}"

providers:
  - id: file://providers/baseline.py
    label: baseline
  - id: file://providers/pipeline.py
    label: pipeline
    config:
      # One pipeline is several model calls. The worker default is five minutes.
      timeout: 600000

# Syntax is is-json. The Python checks are the eval row, headline caps, the
# requested channels, banned words, a call to action, and required phrases.
# They load the case. They do not call a model (ADR 0028).
defaultTest:
  assert:
    - type: is-json
      metric: valid_json
    - type: python
      value: file://providers/assertions.py:assert_json
      metric: eval_row
    - type: python
      value: file://providers/assertions.py:assert_channel_limits
      metric: channel_limits
    - type: python
      value: file://providers/assertions.py:assert_banned_words
      metric: banned_words
    - type: python
      value: file://providers/assertions.py:assert_cta
      metric: cta_present
    - type: python
      value: file://providers/assertions.py:assert_must_mention
      metric: must_mention

tests:
  - file://providers/tests.py:generate_tests

# The model prompts live in prompts/, not in this prompt, so a prompt edit
# would not change promptfoo's cache key. The cache stays off.
# One case at a time: each pipeline run already makes several model calls.
# Override on the CLI with --max-concurrency when you want more.
commandLineOptions:
  cache: false
  maxConcurrency: 1
