[project]
name = "brandforge"
version = "0.1.0.dev0"
description = "Multi-agent pipeline that turns creative briefs into on-brand ad copy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "David Owen Bailey" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[project.scripts]
brandforge = "brandforge:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.poe.tasks]
lint = ["_ruff-check", "_ruff-format-check"]
_ruff-check = "ruff check ."
_ruff-format-check = "ruff format --check ."
format = ["_ruff-fix", "_ruff-format"]
_ruff-fix = "ruff check --fix ."
_ruff-format = "ruff format ."
typecheck = "mypy"
test = "pytest"
check = ["lint", "typecheck", "test"]