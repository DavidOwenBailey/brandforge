name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (Ruff)
        run: uv run poe lint

      - name: Type-check (mypy)
        run: uv run poe typecheck

      - name: Test (pytest)
        run: uv run poe test

  # Real model calls, on five cases. Paused until the repository has
  # ANTHROPIC_API_KEY: an empty secret failed the job. The smoke config stays
  # in evals/promptfooconfig.smoke.yaml (ADR 0031). To turn the job on, replace
  # `if: false` with the fork check:
  #   github.event_name != 'pull_request' ||
  #   github.event.pull_request.head.repo.full_name == github.repository
  # A low judge score does not fail the job. A provider error, a failed hard
  # check, or a judge that cannot grade does.
  smoke:
    name: Eval smoke (5 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --locked

      - name: Eval smoke test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          PROMPTFOO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set. The smoke eval uses the default Anthropic tiers."
            exit 1
          fi
          npx --yes promptfoo@latest eval \
            --config evals/promptfooconfig.smoke.yaml \
            --output smoke-results.json \
            --no-share

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke
          path: smoke-results.json
          if-no-files-found: ignore
